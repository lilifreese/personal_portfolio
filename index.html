<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lili Freese</title>
  
  <link rel="icon" href="logo.png" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Oswald:wght@500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #000;
      color: #fff;
      overflow: hidden;
      transition: opacity 0.4s ease;
    }

    body.fade-out {
      opacity: 0;
    }

    .hero {
      width: 100%;
      height: 100vh;

      background:
              linear-gradient(
                      rgba(0, 0, 0, 0.45),
                      rgba(0, 0, 0, 0.65)
              ),
              url("background.jpg");

      background-size: cover;
      background-position: center;

      display: flex;
      justify-content: center;
      align-items: center;

      text-align: center;
      color: #fff;
    }

    .hero-content {
      padding: 20px;
    }

    .hero-content h1 {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(60px, 10vw, 110px);
      font-weight: 600;
      letter-spacing: 4px;
      line-height: 1;
      margin-bottom: 35px;
    }


    .enter-btn {
      display: inline-block;

      padding: 16px 42px;

      border-radius: 40px;

      background: #fff;
      color: #000;

      text-decoration: none;

      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 1px;

      transition:
              transform 0.3s ease,
              background 0.3s ease;
    }

    .enter-btn:hover {
      transform: scale(1.05);
      background: #eaeaea;
    }

    .socials {
      margin-top: 45px;

      display: flex;
      justify-content: center;
      align-items: center;

      gap: 25px;
    }

    .socials a {
      color: #fff;
      font-size: 22px;
      opacity: 0.8;

      transition:
              opacity 0.3s ease,
              transform 0.3s ease;
    }

    .socials a:hover {
      opacity: 1;
      transform: translateY(-2px);
    }


    @media (max-width: 700px) {

      .hero-content h1 {
        font-size: 60px;
        letter-spacing: 3px;
      }

      .enter-btn {
        padding: 14px 35px;
      }

      .socials {
        margin-top: 35px;
      }

    }

  </style>
</head>

<body>

<section class="hero">

  <div class="hero-content">

    <h1>LILI FREESE</h1>

    <a href="about.html"
       class="enter-btn"
       id="enterBtn">
      ENTER
    </a>

    <div class="socials">

      <a href="https://instagram.com/lilifreesephoto"
         target="_blank"
         rel="noopener noreferrer"
         aria-label="Instagram">
        <i class="fab fa-instagram"></i>
      </a>

      <a href="https://linkedin.com/in/lilifreese"
         target="_blank"
         rel="noopener noreferrer"
         aria-label="LinkedIn">
        <i class="fab fa-linkedin"></i>
      </a>

      <a href="mailto:lilifreese@gmail.com"
         aria-label="Email">
        <i class="fas fa-envelope"></i>
      </a>

    </div>

  </div>

</section>

<script>

  function goToAbout() {

    document.body.classList.add("fade-out");

    setTimeout(function () {
      window.location.href = "about.html";
    }, 400);

  }

  document
          .getElementById("enterBtn")
          .addEventListener("click", function (event) {

            event.preventDefault();

            goToAbout();

          });

  document.addEventListener("keydown", function (event) {

    const activeElement = document.activeElement;

    const tag = activeElement
            ? activeElement.tagName.toLowerCase()
            : "";

    const typing =
            tag === "input" ||
            tag === "textarea";

    if (event.key === "Enter" && !typing) {
      goToAbout();
    }

  });

</script>

</body>
</html>
