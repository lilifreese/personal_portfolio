          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


    <style>

        /* =========================================
           RESET
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {
            font-family: 'DM Sans', sans-serif;
            background: #000;
            color: #fff;
        }


        /* =========================================
           HEADER
        ========================================= */

        header {

            position: sticky;
            top: 0;

            display: flex;
            justify-content: space-between;
            align-items: center;

            height: 80px;

            padding: 0 50px;

            background: #000;

            border-bottom: 1px solid #151515;

            z-index: 1000;
        }


        .nav-left,
        .nav-right {

            display: flex;

            align-items: center;

            gap: 25px;
        }


        .nav-left a,
        .nav-right a {

            font-family: 'DM Sans', sans-serif;

            font-weight: 500;

            letter-spacing: 1px;

            font-size: 16px;

            text-decoration: none;

            color: #fff;

            padding-bottom: 3px;

            transition:
                opacity 0.3s ease,
                border-bottom 0.3s ease;
        }


        .nav-left a.active {

            border-bottom: 2px solid #fff;
        }


        .nav-left a:hover,
        .nav-right a:hover {

            opacity: 0.55;
        }


        .logo {

            position: absolute;

            left: 50%;

            transform: translateX(-50%);

            font-family: 'Oswald', sans-serif;

            font-weight: 600;

            letter-spacing: 2px;

            font-size: 20px;

            white-space: nowrap;
        }


        .nav-right a i {

            font-size: 18px;
        }


        /* =========================================
           TWO MAIN COLUMNS

           PERSONAL        THE REVIEW
           ========================================
           | photos |      | photos |
           | photos |      | photos |
        ========================================= */

        .photo-columns {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 30px;

            padding: 30px;
        }


        /* =========================================
           SECTION TITLES
        ========================================= */

        .photo-section {

            min-width: 0;
        }


        .photo-section h2 {

            font-family: 'Oswald', sans-serif;

            font-size: 24px;

            font-weight: 500;

            letter-spacing: 2px;

            text-transform: uppercase;

            margin-bottom: 20px;
        }


        /* =========================================
           STAGGERED / MASONRY PHOTOS
        ========================================= */

        .photo-masonry {

            column-count: 2;

            column-gap: 10px;
        }


        .photo-masonry a {

            display: block;

            margin-bottom: 10px;

            break-inside: avoid;

            text-decoration: none;
        }


        .photo-masonry img {

            width: 100%;

            height: auto;

            display: block;

            border-radius: 4px;

            cursor: pointer;

            transition:
                transform 0.3s ease,
                opacity 0.3s ease;
        }


        .photo-masonry img:hover {

            transform: scale(1.015);

            opacity: 0.85;
        }


        /* =========================================
           LIGHTBOX
        ========================================= */

        .lightbox {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.94);

            display: none;

            justify-content: center;

            align-items: center;

            padding: 50px;

            z-index: 10000;
        }


        .lightbox:target {

            display: flex;
        }


        .lightbox img {

            max-width: 90vw;

            max-height: 90vh;

            width: auto;

            height: auto;

            object-fit: contain;

            border-radius: 4px;
        }


        .lightbox-close {

            position: absolute;

            top: 20px;

            right: 30px;

            color: #fff;

            font-size: 35px;

            font-weight: 300;

            text-decoration: none;

            line-height: 1;

            transition: opacity 0.3s ease;
        }


        .lightbox-close:hover {

            opacity: 0.6;
        }


        /* =========================================
           TABLET
        ========================================= */

        @media (max-width: 1000px) {

            header {

                padding: 0 35px;
            }


            .photo-columns {

                gap: 20px;

                padding: 20px;
            }

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 800px) {

            header {

                height: auto;

                padding: 18px 20px;

                flex-wrap: wrap;

                gap: 18px;
            }


            .logo {

                position: static;

                transform: none;

                order: -1;

                width: 100%;

                text-align: center;

                font-size: 18px;
            }


            .nav-left,
            .nav-right {

                gap: 15px;
            }


            .nav-left a,
            .nav-right a {

                font-size: 13px;
            }


            /*
             * Personal and The Review
             * stack vertically on mobile.
             */

            .photo-columns {

                grid-template-columns: 1fr;

                gap: 50px;

                padding: 15px;
            }


            /*
             * Personal still has TWO
             * staggered photo columns.
             */

            .photo-masonry {

                column-count: 2;

                column-gap: 10px;
            }


            .photo-section h2 {

                font-size: 22px;

                margin-bottom: 15px;
            }


            .lightbox {

                padding: 25px;
            }


            .lightbox img {

                max-width: 95vw;

                max-height: 85vh;
            }

        }


        /* =========================================
           VERY SMALL PHONES
        ========================================= */

        @media (max-width: 450px) {

            .nav-left {

                gap: 11px;
            }


            .nav-right {

                gap: 12px;
            }


            .nav-left a,
            .nav-right a {

                font-size: 11px;
            }


            /*
             * Keep two photo columns even
             * on small phones.
             */

            .photo-masonry {

                column-count: 2;

                column-gap: 8px;
            }


            .photo-columns {

                padding: 12px;
            }

        }

    </style>

</head>
